# 策略示例（HCL 语法）
# 说明：本文件用于演示策略语法与约束能力，实际策略通过 API 或 CLI 加载。
# 详见 docs/multi-tenancy.md

# ---------------------------------------------------------------------------
# 服务账号：只能使用指定前缀的密钥做加解密
# ---------------------------------------------------------------------------
path "acme/keys/payment-*" {
  capabilities         = ["encrypt", "decrypt"]
  allowed_purposes     = ["ENCRYPT", "DECRYPT"]
  required_parameters  = ["key_id"]
  max_key_version_used = 5
}

# ---------------------------------------------------------------------------
# 签名服务：只能签名，不能解密
# ---------------------------------------------------------------------------
path "acme/keys/contract-signing" {
  capabilities     = ["sign"]
  allowed_purposes = ["SIGN"]
}

# ---------------------------------------------------------------------------
# 证书签发：限定 Profile 与有效期上限
# ---------------------------------------------------------------------------
path "acme/certificates/issue" {
  capabilities      = ["create"]
  allowed_profiles  = ["tls-server", "tls-client"]
  max_validity_days = 397
}

# ---------------------------------------------------------------------------
# 审计员：只读
# ---------------------------------------------------------------------------
path "acme/audit/*" {
  capabilities = ["read", "list"]
}

path "acme/keys/*" {
  capabilities = ["read"]
}

# ---------------------------------------------------------------------------
# 显式拒绝：覆盖其他策略的放宽
# ---------------------------------------------------------------------------
path "acme/keys/ca-root-private" {
  capabilities = ["deny"]
}

# ---------------------------------------------------------------------------
# 平台管理员：需要 sudo 的高危操作
# ---------------------------------------------------------------------------
path "sys/seal" {
  capabilities = ["sudo", "update"]
}

path "sys/rotate/master-key" {
  capabilities = ["sudo", "update"]
}
